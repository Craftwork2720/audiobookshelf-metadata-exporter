services:
  audiobookshelf-exporter:
    build: .
    container_name: audiobookshelf-exporter
    ports:
      - "8080:8080"
    volumes:
      - "./data/db:/db:ro"
      - "./data/items:/items:ro"
      - "./data/exported:/exported:rw"
    environment:
      ABS_DATABASE_PATH: "/db/absdatabase.sqlite"
      ABS_ITEMS_PATH: "/items"
      EXPORT_PATH: "/exported"
      PORT: 8080
    restart: unless-stopped
