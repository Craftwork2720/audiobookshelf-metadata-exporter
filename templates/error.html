{% extends "base.html" %}

{% block title %}{{ error_title }} — Audiobookshelf Exporter{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-danger">
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                <h4 class="mt-3">{{ error_title }}</h4>
                <p class="text-muted">{{ error_message }}</p>
                <a href="{{ url_for('index') }}" class="btn btn-primary mt-2">
                    <i class="bi bi-arrow-counterclockwise"></i> Try Again
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
